# Archived from .github/workflows/release.yml.
#
# These two jobs built the macOS and Linux installers and attached them to the GitHub release on
# every version tag. Removed from the live workflow because only the Windows app and the web build
# are actively maintained targets (see CLAUDE.md) -- kept here, dormant, in case macOS/Linux
# support is picked back up.
#
# To restore:
#   1. Paste both jobs back in under `jobs:` in .github/workflows/release.yml.
#   2. Change macos-installer's `needs:` from `prepare` back to `windows-installer` (they used to
#      run sequentially -- prepare -> windows -> macos -> linux -- rather than in parallel, because
#      all three publish to the same GitHub release via softprops/action-gh-release, and that
#      action does a read-then-write of the release's asset list; running them concurrently risks
#      one job's upload clobbering another's).

macos-installer:
  name: Build and publish macOS installer
  needs: windows-installer
  runs-on: macos-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Build macOS DMG (unsigned)
      run: npm run build:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Attach macOS installer to the release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        files: packages/desktop-shell/release/*.dmg

linux-installer:
  name: Build and publish Linux installer
  needs: macos-installer
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Build Linux AppImage
      run: npm run build:linux

    - name: Attach Linux installer to the release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        files: packages/desktop-shell/release/*.AppImage
