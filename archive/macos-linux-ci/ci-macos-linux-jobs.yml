# Archived from .github/workflows/ci.yml.
#
# These two jobs built the macOS and Linux desktop installers on every push/PR to main. Removed
# from the live workflow because only the Windows app and the web build are actively maintained
# targets (see CLAUDE.md) -- kept here, dormant, in case macOS/Linux support is picked back up.
#
# To restore: paste both jobs back in under `jobs:` in .github/workflows/ci.yml. No other changes
# needed -- they don't depend on, or get depended on by, any other job in that file.

macos-installer:
  name: Build macOS installer
  runs-on: macos-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Build macOS DMG (unsigned)
      run: npm run build:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - uses: actions/upload-artifact@v4
      with:
        name: dicom-viewer-macos-installer
        path: packages/desktop-shell/release/*.dmg
        if-no-files-found: error

linux-installer:
  name: Build Linux installer
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Build Linux AppImage
      run: npm run build:linux

    - uses: actions/upload-artifact@v4
      with:
        name: dicom-viewer-linux-installer
        path: packages/desktop-shell/release/*.AppImage
        if-no-files-found: error
