name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ensures re-running this workflow for a tag that already has a release (e.g. to pick up a
      # renamed/rebuilt installer after a version bump) replaces it cleanly instead of leaving a
      # stale, differently-named asset alongside the new one.
      - name: Remove any existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ inputs.tag_name || github.ref_name }}" --yes --cleanup-tag --repo ${{ github.repository }}
        continue-on-error: true

      - name: Build Windows NSIS installer
        run: npm run build:win

      - name: Create GitHub release with installer attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: packages/desktop-shell/release/*.exe
          generate_release_notes: true
